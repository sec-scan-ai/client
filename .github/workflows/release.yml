name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Install quill
        # Pinned to a release tag so a compromise of quill's main branch
        # cannot inject code that runs with access to our Apple signing
        # secrets. Bump this tag deliberately when upgrading.
        run: curl -sSfL https://raw.githubusercontent.com/anchore/quill/v0.7.1/install.sh | sh -s -- -b /usr/local/bin v0.7.1

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X github.com/sec-scan-ai/client/cmd.Version=${VERSION} -X github.com/sec-scan-ai/client/cmd.BuildTime=${BUILD_TIME}"

          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o sec-scan-darwin-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sec-scan-darwin-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sec-scan-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o sec-scan-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o sec-scan-windows-amd64.exe .

      - name: Sign and notarize macOS binaries
        env:
          QUILL_SIGN_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.APPLE_NOTARIZE_KEY_P8_BASE64 }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARIZE_KEY_ISSUER }}
        run: |
          for BINARY in sec-scan-darwin-arm64 sec-scan-darwin-amd64; do
            echo "Signing and notarizing $BINARY..."
            quill sign-and-notarize "$BINARY" -vv
          done

      - name: Generate checksums
        run: |
          sha256sum \
            sec-scan-darwin-arm64 \
            sec-scan-darwin-amd64 \
            sec-scan-linux-amd64 \
            sec-scan-linux-arm64 \
            sec-scan-windows-amd64.exe \
            > checksums.txt
          cat checksums.txt

      - name: Build release body
        run: |
          cat > release-body.md << 'HEADER'
          ## Install

          **macOS / Linux:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/sec-scan-ai/client/main/install.sh | sh
          ```

          **Windows:** Download `sec-scan-windows-amd64.exe` below and add it to your PATH.

          > macOS binaries are signed and notarized by Apple. No Gatekeeper warnings on first run.

          HEADER

          # Extract the latest version section from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{if(found) exit; found=1; next} found{print}' CHANGELOG.md >> release-body.md
          else
            echo "No changelog entry found." >> release-body.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-body.md
          files: |
            sec-scan-darwin-arm64
            sec-scan-darwin-amd64
            sec-scan-linux-amd64
            sec-scan-linux-arm64
            sec-scan-windows-amd64.exe
            checksums.txt
